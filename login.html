<style>
:root { --bg:#FCFEFF; --surface:#FFFFFF; --surface-2:#F2F9FC; --ink:#1E2925; --ink-soft:#5C6B65; --ink-faint:#8D9A94; --border:#E3EDF4;

[data-theme="dark"] { --bg:#0F172A; --surface:#1E293B; --surface-2:#334155; --ink:#F8FAFC; --ink-soft:#94A3B8; --ink-faint:#64748B; --border:#334155;
  --accent-1:#5F8FC0; --accent-2:#6FB8CC; --ring:rgba(125,151,227,0.24); --shadow-lg:0 1px 1px rgba(0,0,0,0.3), 0 16px 44px rgba(0,0,0,0.45); }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }

.msi { font-size: 17px; vertical-align: middle; }
.ig { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.ord-btn { border: 1.5px solid var(--border); background: var(--surface-2); color: var(--ink); font-size: 12.5px; font-weight: 600; padding: 7px 11px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: background .2s, transform .15s var(--ease); }

/* ===== Access Gate (Login / Apply for Access) + App Owner Dashboard ===== */

  background: radial-gradient(1100px 560px at 8% -12%, rgba(0,180,216,0.14), transparent 62%), radial-gradient(900px 520px at 108% -6%, rgba(138,92,199,0.12), transparent 60%), var(--bg); }

[data-theme="dark"] .ag-note.err  { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.4); color: #FCA5A5; }

</style>

<script>
/* ===== Login / Apply for Access পেজ =====
   মূল অ্যাপ: index.html (একই ফোল্ডার/একই ডোমেইনে রাখতে হবে — সেশন localStorage-এ শেয়ার হয়)।
   ⚠ SUPABASE_URL ও SUPABASE_ANON_KEY index.html-এর মানের সাথে হুবহু এক হতে হবে।
   SQL (app_users টেবিল + register_app_user ফাংশন) index.html-এর কমেন্টে দেওয়া আছে। */
const SUPABASE_URL = '';       // যেমন: https://abcdxyzcompany.supabase.co
const SUPABASE_ANON_KEY = '';  // Supabase → Project Settings → API → anon public
const APP_PAGE = 'index.html';
const OFFLINE_GRACE_HOURS = 72;
(function () {
  const $ = id => document.getElementById(id);
  const SESS_KEY = 'tilesCloudSession', ACCESS_KEY = 'tilesAccessCache', NOTE_KEY = 'tilesLoginNote';
  const jparse = (s, d) => { try { const v = JSON.parse(s); return v == null ? d : v; } catch (e) { return d; } };
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const del = k => { try { localStorage.removeItem(k); } catch (e) {} };

  /* ---------- ভাষা ও থিম ---------- */
  let lang = get('tilesLang') === 'en' ? 'en' : 'bn';
  const tr = (bn, en) => (lang === 'en' ? en : bn);
  document.querySelectorAll('[data-en]').forEach(el => el.setAttribute('data-bn', el.textContent));
  function applyLang() {
    document.documentElement.setAttribute('lang', lang);
    document.querySelectorAll('[data-en]').forEach(el => { el.textContent = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-bn'); });
    $('agLangBn').classList.toggle('active', lang !== 'en'); $('agLangEn').classList.toggle('active', lang === 'en');
    renderNote();
  }
  window.setLang = function (l) { lang = (l === 'en') ? 'en' : 'bn'; put('tilesLang', lang); applyLang(); };
  function setThemeAttr(t) { document.documentElement.setAttribute('data-theme', t); $('agThemeIcon').textContent = t === 'dark' ? 'light_mode' : 'dark_mode'; }
  window.agToggleTheme = function () { setThemeAttr(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };
  setThemeAttr(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  window.togglePwEye = function (id, btn) {
    const el = $(id), show = el.type === 'password';
    el.type = show ? 'text' : 'password'; btn.querySelector('.msi').textContent = show ? 'visibility_off' : 'visibility';
  };

  /* ---------- গেট UI ---------- */
  let tab = 'login', note = null, busy = false;
  const NOTE_ICON = { err: 'error', warn: 'warning', ok: 'check_circle', info: 'hourglass_top' };
  function panel(id) { ['agChecking', 'agForm', 'agOffline', 'agConfig'].forEach(p => { $(p).style.display = (p === id) ? '' : 'none'; }); }
  function renderNote() {
    const box = $('agNote');
    if (!note) { box.style.display = 'none'; return; }
    box.className = 'ag-note ' + note.kind; box.style.display = 'flex';
    $('agNoteIcon').textContent = NOTE_ICON[note.kind] || 'hourglass_top';
    $('agNoteTxt').textContent = tr(note.bn, note.en);
  }
  function setNote(bn, en, kind) { note = bn ? { bn, en, kind: kind || 'info' } : null; renderNote(); }
  function setBusy(b) { busy = b; $('agLoginBtn').disabled = b; $('agApplyBtn').disabled = b; }
  window.agTab = function (t) {
    tab = (t === 'apply') ? 'apply' : 'login';
    const ap = tab === 'apply';
    $('agTabLogin').classList.toggle('active', !ap); $('agTabApply').classList.toggle('active', ap);
    $('agConfirmWrap').style.display = ap ? '' : 'none';
    $('agLoginBtn').style.display = ap ? 'none' : ''; $('agApplyBtn').style.display = ap ? '' : 'none';
    $('agPass').setAttribute('autocomplete', ap ? 'new-password' : 'current-password');
    setNote(null);
  };
  function showForm(n) { panel('agForm'); window.agTab('login'); if (n) setNote(n.bn, n.en, n.kind); }
  ['agEmail', 'agPass', 'agPass2'].forEach(id => $(id).addEventListener('keydown', ev => { if (ev.key === 'Enter') window.agSubmit(); }));

  /* ---------- Supabase ---------- */
  const enabled = /^https:\/\/[^\/\s]+/.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20;
  if (!enabled) { applyLang(); panel('agConfig'); return; }
  const BASE = SUPABASE_URL.replace(/\/+$/, '');
  let session = jparse(get(SESS_KEY), null);

  async function authReq(grant, body) {
    const res = await fetch(BASE + '/auth/v1/token?grant_type=' + grant, {
      method: 'POST', cache: 'no-store', headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(j.error_description || j.msg || j.message || ('http ' + res.status)); e.status = res.status; throw e; }
    return j;
  }
  function setSession(j) {
    session = { access_token: j.access_token, refresh_token: j.refresh_token,
      expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)), user: { id: j.user && j.user.id, email: j.user && j.user.email } };
    put(SESS_KEY, JSON.stringify(session));
  }
  function dropSession() { session = null; del(SESS_KEY); del(ACCESS_KEY); }
  async function freshSession(force) {
    if (!session) return null;
    if (force || session.expires_at - 60 < Date.now() / 1000) {
      try { setSession(await authReq('refresh_token', { refresh_token: session.refresh_token })); }
      catch (e) { if (e.status === 400 || e.status === 401 || e.status === 403) { dropSession(); return null; } throw e; }
    }
    return session;
  }
  async function api(path, opt, retried) {
    const s = await freshSession(false);
    if (!s) throw new Error('auth');
    opt = opt || {};
    const res = await fetch(BASE + path, { method: opt.method || 'GET', cache: 'no-store', body: opt.body,
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json' } });
    if (res.status === 401 && !retried) { await freshSession(true); return api(path, opt, true); }
    if (!res.ok) { const er = new Error('http ' + res.status); er.status = res.status; throw er; }
    return res;
  }
  async function fetchProfile() {
    let res = await api('/rest/v1/app_users?select=user_id,email,status,is_owner&user_id=eq.' + encodeURIComponent(session.user.id));
    const rows = await res.json();
    if (Array.isArray(rows) && rows[0]) return rows[0];
    res = await api('/rest/v1/rpc/register_app_user', { method: 'POST', body: '{}' });   // প্রথম ইউজার = Owner, বাকিরা = pending
    const r = await res.json();
    return Array.isArray(r) ? r[0] : r;
  }

  const BLOCK_MSG = {
    pending:  { bn: 'আপনার আবেদন এখনো পেন্ডিং আছে। অ্যাপ ওনার অনুমোদন দিলে তারপর লগইন করুন।', en: 'Your request is still pending. Log in again after the app owner approves it.', kind: 'info' },
    locked:   { bn: 'আপনার অ্যাক্সেস অ্যাপ ওনার লক করেছেন। আনলক না হওয়া পর্যন্ত অ্যাপ ব্যবহার করা যাবে না।', en: 'Your access has been locked by the app owner. You cannot use the app until it is unlocked.', kind: 'warn' },
    kicked:   { bn: 'অ্যাপ ওনার আপনাকে এই অ্যাপ থেকে সরিয়ে দিয়েছেন।', en: 'The app owner has removed you from this app.', kind: 'err' },
    rejected: { bn: 'আপনার আবেদন অ্যাপ ওনার বাতিল করেছেন।', en: 'Your request was rejected by the app owner.', kind: 'err' },
    unknown:  { bn: 'আপনার অ্যাক্সেস যাচাই করা যায়নি। আবার লগইন করুন।', en: 'Your access could not be verified. Please log in again.', kind: 'err' }
  };
  const SETUP_MSG = { bn: 'ডেটাবেস সেটআপ সম্পূর্ণ নয় (app_users টেবিল/ফাংশন নেই)। index.html-এর উপরের SQL চালান।', en: 'Database setup is incomplete (app_users table/function missing). Run the SQL from the top of index.html.', kind: 'err' };

  function goApp(p, welcome) {
    put(ACCESS_KEY, JSON.stringify({ uid: p.user_id, email: p.email, status: 'approved', is_owner: !!p.is_owner, t: Date.now() }));
    if (welcome && p.is_owner) put('tilesWelcomeOwner', '1');
    panel('agChecking'); location.replace(APP_PAGE);
  }
  /* সেশন যাচাই করে: approved → অ্যাপে; নইলে সেশন মুছে কারণসহ ফর্ম */
  async function check(opt) {
    opt = opt || {};
    panel('agChecking');
    try {
      const p = await fetchProfile();
      if (p && p.status === 'approved') { goApp(p, opt.fromApply); return; }
      dropSession();
      if (p && p.status === 'pending' && opt.fromApply)
        showForm({ bn: 'আপনার আবেদন জমা হয়েছে। অ্যাপ ওনার অনুমোদন দিলে লগইন করে অ্যাপ ব্যবহার করতে পারবেন।', en: 'Your request has been submitted. You can log in and use the app once the app owner approves it.', kind: 'ok' });
      else showForm(BLOCK_MSG[(p && p.status) || 'unknown'] || BLOCK_MSG.unknown);
    } catch (e) {
      if (!session) { showForm({ bn: 'সেশন শেষ হয়েছে — আবার লগইন করুন।', en: 'Session expired — please log in again.', kind: 'warn' }); return; }
      if (e && (e.status === 401 || e.status === 403)) { dropSession(); showForm({ bn: 'সেশন শেষ হয়েছে — আবার লগইন করুন।', en: 'Session expired — please log in again.', kind: 'warn' }); return; }
      if (e && e.status === 404) { dropSession(); showForm(SETUP_MSG); return; }
      const c = jparse(get(ACCESS_KEY), null);                     // ইন্টারনেট নেই: শেষবার approved হলে অফলাইনে ঢুকতে দেওয়া
      if (c && c.uid === session.user.id && c.status === 'approved' && (Date.now() - c.t) < OFFLINE_GRACE_HOURS * 3600e3) { location.replace(APP_PAGE); return; }
      panel('agOffline');
    }
  }
  window.agRetry = function () { check(); };
  window.agBackToLogin = function () { dropSession(); showForm(); };

  async function doLogin() {
    const email = ($('agEmail').value || '').trim(), password = $('agPass').value || '';
    if (!email || !password) { setNote('ইমেইল ও পাসওয়ার্ড দিন।', 'Enter email and password.', 'err'); return; }
    setBusy(true); setNote('লগইন হচ্ছে…', 'Signing in…', 'info');
    try {
      setSession(await authReq('password', { email, password }));
      $('agPass').value = '';
      await check({ fromLogin: true });
    } catch (e) {
      const m = String((e && e.message) || '');
      if (/confirm/i.test(m)) setNote('ইমেইল এখনো কনফার্ম হয়নি — মেইল চেক করে লিংকে ক্লিক করুন।', 'Email is not confirmed yet — check your inbox and click the link.', 'warn');
      else if (e && (e.status === 400 || e.status === 401)) setNote('ইমেইল বা পাসওয়ার্ড ভুল।', 'Wrong email or password.', 'err');
      else setNote('লগইন করা যায়নি — ইন্টারনেট চেক করুন।', 'Could not sign in — check your internet.', 'err');
    } finally { setBusy(false); }
  }
  async function doApply() {
    const email = ($('agEmail').value || '').trim(), p1 = $('agPass').value || '', p2 = $('agPass2').value || '';
    if (!email || !p1) { setNote('ইমেইল ও পাসওয়ার্ড দিন।', 'Enter email and password.', 'err'); return; }
    if (p1.length < 6) { setNote('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।', 'Password must be at least 6 characters.', 'err'); return; }
    if (p1 !== p2) { setNote('পাসওয়ার্ড ও নিশ্চিতকরণ মিলছে না।', 'Password and confirmation do not match.', 'err'); return; }
    setBusy(true); setNote('আবেদন পাঠানো হচ্ছে…', 'Submitting your request…', 'info');
    try {
      const res = await fetch(BASE + '/auth/v1/signup', { method: 'POST', cache: 'no-store',
        headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: p1 }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) {
        const m = String(j.msg || j.message || j.error_description || '');
        if (/already|registered/i.test(m)) { window.agTab('login'); setNote('এই ইমেইল আগে থেকেই আছে — লগইন করুন।', 'This email already exists — please log in.', 'warn'); }
        else if (res.status === 422 || res.status === 400) setNote('আবেদন নেওয়া যায়নি: ' + m, 'Request was not accepted: ' + m, 'err');
        else setNote('আবেদন পাঠানো যায়নি — ইন্টারনেট চেক করুন।', 'Could not submit — check your internet.', 'err');
        return;
      }
      if (j.access_token) { setSession(j); $('agPass').value = ''; $('agPass2').value = ''; await check({ fromApply: true }); }
      else { window.agTab('login'); setNote('ইমেইলে কনফার্মেশন লিংক পাঠানো হয়েছে। কনফার্ম করে লগইন করুন — তারপর আপনার আবেদন অ্যাপ ওনারের কাছে যাবে।', 'A confirmation link was emailed. Confirm it, then log in — your request will then go to the app owner.', 'ok'); }
    } catch (e) {
      setNote('আবেদন পাঠানো যায়নি — ইন্টারনেট চেক করুন।', 'Could not submit — check your internet.', 'err');
    } finally { setBusy(false); }
  }
  window.agSubmit = function () { if (busy) return; (tab === 'apply' ? doApply : doLogin)(); };

  /* ---------- শুরু ---------- */
  applyLang();
  const stored = jparse(get(NOTE_KEY), null); del(NOTE_KEY);       // index.html থেকে ফেরত পাঠানোর কারণ
  if (session) check();
  else showForm(stored);
  if (session && stored) { /* check() শেষে নিজেই সঠিক বার্তা দেখাবে */ }
})();
</script>
</body></html>
